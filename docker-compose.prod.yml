services:
  pf2e-sheet:
    build: .
    container_name: pf2e-elhoss-sheet
    expose:
      - "8000"
    env_file:
      - deploy/.env
    volumes:
      - pf2e_data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: pf2e-elhoss-caddy
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - deploy/.env
    volumes:
      - ./deploy/Caddyfile.http:/etc/caddy/Caddyfile.http:ro
      - ./deploy/Caddyfile.tls:/etc/caddy/Caddyfile.tls:ro
      - caddy_data:/data
      - caddy_config:/config
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$SITE_DOMAIN" ] && [ "$$SITE_DOMAIN" != ":80" ]; then
          exec caddy run --config /etc/caddy/Caddyfile.tls --adapter caddyfile
        else
          exec caddy run --config /etc/caddy/Caddyfile.http --adapter caddyfile
        fi
    depends_on:
      - pf2e-sheet
    restart: unless-stopped

volumes:
  pf2e_data:
  caddy_data:
  caddy_config:
